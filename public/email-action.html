<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkingGo — Verificação de E-mail</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F8FAFC;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .logo { width: 160px; margin-bottom: 32px; }
    .icon { font-size: 56px; margin-bottom: 16px; }
    .title {
      font-size: 22px;
      font-weight: 700;
      color: #1E293B;
      margin-bottom: 12px;
    }
    .body {
      font-size: 15px;
      color: #475569;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-block;
      background: #2563EB;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      padding: 14px 32px;
      border-radius: 12px;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }
    .btn:hover { background: #1D4ED8; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #E2E8F0;
      border-top-color: #2563EB;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none; }
  </style>
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192.png?v=2" />
  <link rel="apple-touch-icon" href="/assets/img/favicon-192.png?v=2" />
</head>
<body>
  <div class="card">
    <img class="logo" src="/assets/logo.png" alt="LinkingGo" onerror="this.style.display='none'" />

    <!-- Loading -->
    <div id="state-loading">
      <div class="spinner"></div>
      <p class="body">Verificando seu e-mail...</p>
    </div>

    <!-- Sucesso -->
    <div id="state-success" class="hidden">
      <div class="icon">✅</div>
      <h1 class="title">E-mail verificado!</h1>
      <p class="body">Sua conta foi confirmada com sucesso.<br>Abra o app LinkingGo e faça seu login.</p>
      <a class="btn" href="linkinggo://login">Abrir o App</a>
    </div>

    <!-- Erro -->
    <div id="state-error" class="hidden">
      <div class="icon">❌</div>
      <h1 class="title">Link inválido</h1>
      <p id="error-msg" class="body">O link de verificação expirou ou já foi utilizado.<br>Faça login no app e solicite um novo link.</p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, applyActionCode } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

    const app = initializeApp({
      apiKey: "AIzaSyDnStmxzdXdzIwwqzhiB1tPHOdACOd7MeE",
      authDomain: "linkinggo.firebaseapp.com",
      projectId: "linkinggo",
    });
    const auth = getAuth(app);

    function show(id) {
      ['state-loading', 'state-success', 'state-error'].forEach(s => {
        document.getElementById(s).classList.toggle('hidden', s !== id);
      });
    }

    const params = new URLSearchParams(window.location.search);
    const mode = params.get('mode');
    const oobCode = params.get('oobCode');

    if (mode === 'verifyEmail' && oobCode) {
      applyActionCode(auth, oobCode)
        .then(() => show('state-success'))
        .catch(err => {
          const msg = err.code === 'auth/invalid-action-code'
            ? 'O link de verificação expirou ou já foi utilizado.\nFaça login no app e solicite um novo link.'
            : 'Não foi possível verificar o e-mail. Tente novamente.';
          document.getElementById('error-msg').innerText = msg;
          show('state-error');
        });
    } else if (mode === 'resetPassword' && oobCode) {
      // Redireciona para a página de reset existente se houver
      window.location.href = '/reset-password.html' + window.location.search;
    } else {
      document.getElementById('error-msg').innerText = 'Link inválido. Verifique o e-mail e tente novamente.';
      show('state-error');
    }
  </script>
</body>
</html>
